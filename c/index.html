<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>HandWarp</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1f2328;--dim:#59636e;--line:#d1d9e0;--link:#0b5cad}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--fg:#e6e8eb;--dim:#9aa4ae;--line:#30363d;--link:#7cb7ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:40em;margin:0 auto;padding:16px 16px 48px}
nav{display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:space-between;font-size:.95em;padding-bottom:12px;border-bottom:1px solid var(--line)}
a{color:var(--link)}h1{font-size:1.6em;line-height:1.3;margin:24px 0 8px}h2{font-size:1.15em;margin:28px 0 8px}
p,li{overflow-wrap:anywhere}ul{padding-left:1.3em}li{margin:6px 0}
footer{margin-top:40px;padding-top:12px;border-top:1px solid var(--line);color:var(--dim);font-size:.9em}
.card{margin:28px 0;padding:22px 20px;border:1px solid var(--line);border-radius:16px;text-align:center}
.tag{font-size:.85em;letter-spacing:.18em;color:var(--dim)}
.msg{font-size:1.35em;font-weight:800;line-height:1.4;margin:10px 0 4px}
.meta{color:var(--dim);margin:0 0 18px}
.btns{display:flex;flex-direction:column;gap:10px;max-width:22em;margin:0 auto}
.btn{display:block;padding:13px 18px;border-radius:12px;border:1px solid var(--link);color:var(--link);text-decoration:none;font-weight:800;min-height:44px}
.btn.primary{background:var(--link);color:var(--bg)}
.note{color:var(--dim);font-size:.9em;margin-top:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<nav><span>HandWarp</span><span id="lang-sw"></span></nav>
<div class="card">
<div class="tag" id="tag">⚑ HANDWARP</div>
<div class="msg" id="msg"></div>
<p class="meta" id="meta"></p>
<div class="btns">
<a class="btn primary" id="open" hidden></a>
<a class="btn" id="store" href="https://apps.apple.com/app/id6835481823"></a>
</div>
<p class="note" id="note"></p>
</div>
<footer><a href="../privacy-zh.html">隱私權政策</a> <a href="../privacy-en.html">Privacy Policy</a></footer>
</main>
<script>
(function () {
  var zh = /^zh/i.test((navigator.languages && navigator.languages[0]) || navigator.language || "");
  function strings() {
    return zh
    ? { msg: "朋友挑戰你：在「{name}」用 {time} 秒，你能更快嗎？", open: "已安裝？開啟 HandWarp", store: "下載 HandWarp（App Store）", bad: "這個挑戰連結看不懂，可能被改過或已經損壞。", note: "手機上沒有自動開啟 App？先從 App Store 安裝，再回到這個頁面按「開啟 HandWarp」。", chal: "挑戰航線", warp: "曲速 {w}", other: "English", unknown: "一站" }
      : { msg: "A friend challenges you: {time} s on {name}. Can you go faster?", open: "Already installed? Open HandWarp", store: "Get HandWarp on the App Store", bad: "This challenge link cannot be read. It may have been changed or damaged.", note: "If the app does not open, install it from the App Store first, then come back and tap Open HandWarp.", chal: "Challenge route", warp: "Warp {w}", other: "中文", unknown: "a stop" };
  }
  var NAMES = { "w1-1": ["繞地出港", "Earth Orbit Departure"], "w1-2": ["浮標選線", "Buoy Lanes"], "w1-3": ["月緣回收帶", "Lunar Limb Salvage"] };
  document.documentElement.lang = zh ? "zh-Hant" : "en";
  var $ = function (id) { return document.getElementById(id); };
  var sw = document.createElement("a");
  sw.href = "#";
  sw.onclick = function (e) { e.preventDefault(); zh = !zh; render(); };
  $("lang-sw").appendChild(sw);
  var q = new URLSearchParams(location.search);
  function one(k) { var a = q.getAll(k); return a.length === 1 ? a[0] : null; }
  var s = one("s"), v = one("v"), k = one("k"), t = one("t");
  var ok = s !== null && /^[a-z0-9-]{1,16}$/.test(s) && v !== null && /^j[0-9]{1,3}c?$/.test(v) && (k === "base" || k === "plus" || k === "max") && t !== null && /^[0-9]{1,8}$/.test(t) && +t >= 5000 && +t <= 3600000;
  function render() {
    var A = strings();
    document.documentElement.lang = zh ? "zh-Hant" : "en";
    sw.textContent = A.other;
    $("store").textContent = A.store;
    $("note").textContent = A.note;
    $("open").textContent = A.open;
    if (!ok) { $("msg").textContent = A.bad; $("meta").textContent = ""; $("open").hidden = true; return; }
    var base = s.replace(/c$/, ""), isChal = s !== base && NAMES[base] !== undefined;
    var nm = NAMES[s] || (isChal ? NAMES[base] : null);
    var name = nm ? nm[zh ? 0 : 1] : A.unknown;
    if (isChal) name += (zh ? "（" : " (") + A.chal + (zh ? "）" : ")");
    $("msg").textContent = A.msg.replace("{name}", name).replace("{time}", (+t / 1000).toFixed(2));
    $("meta").textContent = A.warp.replace("{w}", k === "base" ? "1" : k === "plus" ? "2" : "3");
    $("open").href = "handwarp://challenge?s=" + encodeURIComponent(s) + "&v=" + encodeURIComponent(v) + "&k=" + k + "&t=" + (+t);
    $("open").hidden = false;
  }
  render();
})();
</script>
</body>
</html>
